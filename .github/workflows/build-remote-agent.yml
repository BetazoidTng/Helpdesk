# Builds the Remote Assist Agent's real installers on real Windows and
# macOS machines -- GitHub-hosted runners, not this repo's own server --
# because that's what electron-builder's msi and pkg targets actually
# require (see remote-agent/README.md's "Building" section for why
# neither can be produced on Linux, or cross-built from the other OS).
#
# Run it from the Actions tab ("Run workflow"), or push a tag like
# "remote-agent-v1.0.0" to trigger it automatically. Either way, the
# finished installer.msi and .pkg show up as downloadable workflow
# artifacts (Actions run -> "Artifacts" at the bottom) -- not published
# anywhere public, and not code-signed (see the README for that step).
# test
name: Build Remote Assist Agent installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'remote-agent-v*'

jobs:
  windows-msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: remote-assist-agent-windows-msi
          path: remote-agent/dist/*.msi

  macos-pkg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: remote-assist-agent-macos-pkg
          path: remote-agent/dist/*.pkg
