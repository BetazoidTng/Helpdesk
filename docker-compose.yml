version: "3.8"

# Runs Microsoft SQL Server (Linux container) locally for development.
# db/schema.sql is written in SQL-2012-compatible syntax, same as the CRM
# and Auction Site projects, so it also runs unchanged against an older
# on-prem SQL Server if that's where this ends up in production.
#
# Start it with:  docker compose up -d
# Stop it with:   docker compose down
# Wipe data too:  docker compose down -v

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: helpdesk-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Helpdesk!2024"
      MSSQL_PID: "Developer"
    ports:
      # 1435 on the host -- distinct from the CRM (1434) and Auction Site
      # (1433) projects' own SQL Server containers, so all three can run
      # at the same time. Adjust DB_PORT in .env to match if you change
      # this.
      - "1435:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver_data:
