<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Article - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/kb.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <div class="links" id="nav-links"></div>
</nav>

<main>
    <p class="meta"><a href="/kb.html">&larr; Back to Knowledge Base</a></p>
    <div id="article-root" class="panel"><p class="meta">Loading...</p></div>
</main>

<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script>
const slug = new URLSearchParams(window.location.search).get('slug');

async function render() {
    const root = document.getElementById('article-root');
    try {
        const data = await fetchJson(`/api/kb/${encodeURIComponent(slug)}`);
        const a = data.article;
        document.title = `${a.Title} - Helpdesk`;
        root.innerHTML = `
            <h1>${escapeHtml(a.Title)}</h1>
            <p class="meta">
                ${escapeHtml(a.CategoryName || 'Uncategorized')}
                &middot; by ${escapeHtml(a.AuthorName || 'Unknown')}
                &middot; updated ${formatDate(a.UpdatedAt)}
                ${!a.IsPublished ? '&middot; <span class="badge status-Pending">Draft</span>' : ''}
            </p>
            <div style="white-space:pre-wrap;margin-top:14px;">${escapeHtml(a.Body)}</div>
        `;
    } catch (err) {
        root.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    }
}

render();
</script>
</body>
</html>
