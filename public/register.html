<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Create an account - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/login.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
</nav>

<main class="narrow">
    <h1>Create an account</h1>
    <p class="subtitle">So you can submit tickets and track their progress.</p>

    <div class="panel" id="register-panel">
        <form id="register-form">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required autofocus>
            <label for="requesterType">I am...</label>
            <select id="requesterType" name="requesterType">
                <option value="External">An external customer</option>
                <option value="Internal">Internal staff</option>
            </select>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
            <p class="meta">At least 8 characters.</p>
            <p class="error" id="form-error" style="display:none;"></p>
            <button class="btn" type="submit" style="margin-top:10px;width:100%;">Create account</button>
        </form>
        <p class="meta" style="margin-top:16px;">Already have an account? <a href="/login.html">Log in</a>.</p>
    </div>
</main>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.style.display = 'none';
    const body = Object.fromEntries(new FormData(e.target).entries());

    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'same-origin',
    });
    const data = await res.json();

    if (!res.ok) {
        errorEl.textContent = data.error || 'Registration failed.';
        errorEl.style.display = 'block';
        return;
    }

    window.location.href = '/portal.html';
});
</script>
</body>
</html>
