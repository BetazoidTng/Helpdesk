<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Ticket Queue - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/queue.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <div class="links" id="nav-links"></div>
</nav>

<main>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
            <h1>Ticket Queue</h1>
            <p class="subtitle">Every ticket raised by email or the portal.</p>
        </div>
        <button class="btn" id="new-ticket-btn">+ New Ticket</button>
    </div>

    <div class="panel" id="new-ticket-panel" style="display:none;max-width:560px;">
        <h2>New ticket</h2>
        <form id="new-ticket-form">
            <div class="form-grid">
                <div>
                    <label for="requesterName">Requester name</label>
                    <input type="text" id="requesterName" name="requesterName" required>
                </div>
                <div>
                    <label for="requesterEmail">Requester email</label>
                    <input type="email" id="requesterEmail" name="requesterEmail" required>
                </div>
            </div>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
            <div class="form-grid">
                <div>
                    <label for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId"><option value="">Loading...</option></select>
                </div>
                <div>
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
            </div>
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required></textarea>
            <p class="error" id="new-ticket-error" style="display:none;"></p>
            <div style="margin-top:12px;display:flex;gap:10px;">
                <button class="btn" type="submit">Create ticket</button>
                <button class="btn secondary" type="button" id="cancel-new-ticket">Cancel</button>
            </div>
        </form>
    </div>

    <div class="panel">
        <div class="toolbar">
            <input type="search" id="search" placeholder="Search subject or ticket number...">
            <select id="filter-status">
                <option value="">Any status</option>
                <option value="New">New</option>
                <option value="Open">Open</option>
                <option value="Pending">Pending</option>
                <option value="Resolved">Resolved</option>
                <option value="Closed">Closed</option>
            </select>
            <select id="filter-priority">
                <option value="">Any priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
            </select>
            <select id="filter-assigned">
                <option value="">Anyone</option>
                <option value="me">Assigned to me</option>
                <option value="unassigned">Unassigned</option>
            </select>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Ticket</th><th>Subject</th><th>Requester</th><th>Priority</th><th>Status</th><th>Assigned</th><th>SLA</th><th>Updated</th></tr>
                </thead>
                <tbody id="tickets-body">
                    <tr><td colspan="8" class="meta">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script>
let searchDebounce;

function currentFilters() {
    const params = new URLSearchParams();
    const search = document.getElementById('search').value.trim();
    const status = document.getElementById('filter-status').value;
    const priority = document.getElementById('filter-priority').value;
    const assigned = document.getElementById('filter-assigned').value;
    if (search) params.set('search', search);
    if (status) params.set('status', status);
    if (priority) params.set('priority', priority);
    if (assigned) params.set('assigned', assigned);
    return params.toString();
}

async function loadTickets() {
    const body = document.getElementById('tickets-body');
    try {
        const data = await fetchJson('/api/tickets?' + currentFilters());
        if (data.tickets.length === 0) {
            body.innerHTML = '<tr><td colspan="8" class="meta">No tickets match these filters.</td></tr>';
            return;
        }
        body.innerHTML = data.tickets.map((t) => `
            <tr>
                <td><a class="row-link" href="/ticket.html?id=${t.Id}">${escapeHtml(t.TicketNumber)}</a></td>
                <td><a class="row-link" href="/ticket.html?id=${t.Id}">${escapeHtml(t.Subject)}</a></td>
                <td class="meta">${escapeHtml(t.RequesterName || t.RequesterEmail || '')}</td>
                <td>${priorityBadge(t.Priority)}</td>
                <td>${statusBadge(t.Status)}</td>
                <td class="meta">${escapeHtml(t.AssignedAgentName || 'Unassigned')}</td>
                <td>${t.SLABreached ? '<span class="badge breached">Breached</span>' : ''}</td>
                <td class="meta">${formatDateTime(t.UpdatedAt)}</td>
            </tr>
        `).join('');
    } catch (err) {
        body.innerHTML = `<tr><td colspan="8" class="error">${escapeHtml(err.message)}</td></tr>`;
    }
}

document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadTickets, 300);
});
['filter-status', 'filter-priority', 'filter-assigned'].forEach((id) => {
    document.getElementById(id).addEventListener('change', loadTickets);
});

async function loadCategories() {
    const select = document.getElementById('categoryId');
    try {
        const data = await fetchJson('/api/categories');
        select.innerHTML = '<option value="">(none)</option>' +
            data.categories.map((c) => `<option value="${c.Id}">${escapeHtml(c.Name)}</option>`).join('');
    } catch (err) {
        select.innerHTML = '<option value="">(none)</option>';
    }
}

document.getElementById('new-ticket-btn').addEventListener('click', () => {
    document.getElementById('new-ticket-panel').style.display = 'block';
    loadCategories();
});
document.getElementById('cancel-new-ticket').addEventListener('click', () => {
    document.getElementById('new-ticket-panel').style.display = 'none';
});

document.getElementById('new-ticket-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('new-ticket-error');
    errorEl.style.display = 'none';
    const form = new FormData(e.target);
    try {
        const res = await fetch('/api/tickets', { method: 'POST', body: form, credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Failed to create ticket.');
        window.location.href = `/ticket.html?id=${data.id}`;
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
    }
});

loadTickets();
setInterval(loadTickets, 30000);
</script>
</body>
</html>
