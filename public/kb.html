<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Knowledge Base - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/kb.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <div class="links" id="nav-links"></div>
</nav>

<main>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
            <h1>Knowledge Base</h1>
            <p class="subtitle">Answers to common questions. Can't find yours? Submit a ticket.</p>
        </div>
        <button class="btn" id="new-article-btn" style="display:none;">+ New Article</button>
    </div>

    <div class="panel" id="article-form-panel" style="display:none;max-width:680px;">
        <h2 id="article-form-title">New article</h2>
        <form id="article-form">
            <input type="hidden" id="article-id" name="id">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId"><option value="">(none)</option></select>
            <label for="body">Body</label>
            <textarea id="body" name="body" rows="8" required></textarea>
            <label style="display:flex;align-items:center;gap:6px;margin-top:10px;">
                <input type="checkbox" id="isPublished" name="isPublished" style="width:auto;">
                <span class="meta" style="margin:0;">Published</span>
            </label>
            <p class="error" id="article-form-error" style="display:none;"></p>
            <div style="margin-top:12px;display:flex;gap:10px;">
                <button class="btn" type="submit">Save</button>
                <button class="btn secondary" type="button" id="cancel-article-form">Cancel</button>
            </div>
        </form>
    </div>

    <div class="toolbar">
        <input type="search" id="search" placeholder="Search the knowledge base...">
    </div>

    <div id="articles-list" class="panel"><p class="meta">Loading...</p></div>
</main>

<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script>
let isStaff = false;
let searchDebounce;

async function loadUser() {
    try {
        const data = await fetchJson('/api/auth/me');
        isStaff = !!data.user && (data.user.role === 'Admin' || data.user.role === 'Agent');
    } catch (err) {
        isStaff = false;
    }
    document.getElementById('new-article-btn').style.display = isStaff ? 'inline-block' : 'none';
}

async function loadCategoriesInto(select) {
    try {
        const data = await fetchJson('/api/categories');
        select.innerHTML = '<option value="">(none)</option>' +
            data.categories.map((c) => `<option value="${c.Id}">${escapeHtml(c.Name)}</option>`).join('');
    } catch (err) {
        select.innerHTML = '<option value="">(none)</option>';
    }
}

async function loadArticles() {
    const list = document.getElementById('articles-list');
    try {
        const params = new URLSearchParams();
        const search = document.getElementById('search').value.trim();
        if (search) params.set('search', search);
        const data = await fetchJson('/api/kb?' + params.toString());
        if (data.articles.length === 0) {
            list.innerHTML = '<p class="meta">No articles found.</p>';
            return;
        }
        list.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Title</th><th>Category</th>${isStaff ? '<th>Published</th><th></th>' : ''}</tr></thead>
                    <tbody>
                        ${data.articles.map((a) => `
                            <tr>
                                <td><a class="row-link" href="/kb-article.html?slug=${encodeURIComponent(a.Slug)}">${escapeHtml(a.Title)}</a></td>
                                <td class="meta">${escapeHtml(a.CategoryName || 'Uncategorized')}</td>
                                ${isStaff ? `
                                    <td>${a.IsPublished ? '<span class="badge status-Resolved">Yes</span>' : '<span class="badge status-Pending">Draft</span>'}</td>
                                    <td><button class="btn small secondary" data-edit="${a.Id}">Edit</button></td>
                                ` : ''}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        if (isStaff) {
            list.querySelectorAll('[data-edit]').forEach((btn) => {
                btn.addEventListener('click', () => editArticle(parseInt(btn.dataset.edit, 10), data.articles));
            });
        }
    } catch (err) {
        list.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    }
}

async function editArticle(id, articlesCache) {
    const summary = articlesCache.find((a) => a.Id === id);
    if (!summary) return;
    const data = await fetchJson(`/api/kb/${summary.Slug}`);
    const article = data.article;
    document.getElementById('article-form-title').textContent = 'Edit article';
    document.getElementById('article-id').value = article.Id;
    document.getElementById('title').value = article.Title;
    document.getElementById('body').value = article.Body;
    document.getElementById('isPublished').checked = !!article.IsPublished;
    await loadCategoriesInto(document.getElementById('categoryId'));
    document.getElementById('categoryId').value = article.CategoryId || '';
    document.getElementById('article-form-panel').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('new-article-btn').addEventListener('click', async () => {
    document.getElementById('article-form-title').textContent = 'New article';
    document.getElementById('article-form').reset();
    document.getElementById('article-id').value = '';
    await loadCategoriesInto(document.getElementById('categoryId'));
    document.getElementById('article-form-panel').style.display = 'block';
});
document.getElementById('cancel-article-form').addEventListener('click', () => {
    document.getElementById('article-form-panel').style.display = 'none';
});

document.getElementById('article-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('article-form-error');
    errorEl.style.display = 'none';
    const id = document.getElementById('article-id').value;
    const body = {
        title: document.getElementById('title').value,
        categoryId: document.getElementById('categoryId').value || null,
        body: document.getElementById('body').value,
        isPublished: document.getElementById('isPublished').checked,
    };
    try {
        if (id) {
            await fetchJson(`/api/kb/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        } else {
            await fetchJson('/api/kb', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }
        document.getElementById('article-form-panel').style.display = 'none';
        loadArticles();
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
    }
});

document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadArticles, 300);
});

(async function init() {
    await loadUser();
    await loadArticles();
})();
</script>
</body>
</html>
