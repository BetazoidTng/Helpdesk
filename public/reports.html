<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Reports - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/queue.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <div class="links" id="nav-links"></div>
</nav>

<main>
    <h1>Reports</h1>
    <p class="subtitle">How the queue is doing right now and over the last 30 days.</p>

    <div class="stat-grid">
        <div class="stat"><div class="value" id="stat-open">-</div><div class="label">Open tickets</div></div>
        <div class="stat"><div class="value" id="stat-resolved-week">-</div><div class="label">Resolved this week</div></div>
        <div class="stat"><div class="value" id="stat-breached">-</div><div class="label">Currently breached</div></div>
        <div class="stat"><div class="value" id="stat-created-week">-</div><div class="label">Created this week</div></div>
        <div class="stat"><div class="value" id="stat-avg-resolution">-</div><div class="label">Avg. resolution (30d)</div></div>
    </div>

    <div class="chart-grid">
        <div class="panel chart-card">
            <h2>Created vs. resolved (30 days)</h2>
            <canvas id="trend-chart"></canvas>
        </div>
        <div class="panel chart-card">
            <h2>By status</h2>
            <canvas id="status-chart"></canvas>
        </div>
        <div class="panel chart-card">
            <h2>By priority</h2>
            <canvas id="priority-chart"></canvas>
        </div>
        <div class="panel chart-card">
            <h2>By category</h2>
            <canvas id="category-chart"></canvas>
        </div>
        <div class="panel chart-card">
            <h2>Agent workload</h2>
            <canvas id="workload-chart"></canvas>
        </div>
    </div>
</main>

<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
const charts = {};

function drawChart(canvasId, config) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, config);
}

async function loadSummary() {
    const data = await fetchJson('/api/reports/summary');
    document.getElementById('stat-open').textContent = data.openCount;
    document.getElementById('stat-resolved-week').textContent = data.resolvedThisWeek;
    document.getElementById('stat-breached').textContent = data.currentlyBreached;
    document.getElementById('stat-created-week').textContent = data.createdThisWeek;
    document.getElementById('stat-avg-resolution').textContent = data.avgResolutionHours30d !== null ? `${data.avgResolutionHours30d}h` : '-';
}

async function loadTrend() {
    const data = await fetchJson('/api/reports/trend?days=30');
    drawChart('trend-chart', {
        type: 'line',
        data: {
            labels: data.labels,
            datasets: [
                { label: 'Created', data: data.created, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', tension: 0.25 },
                { label: 'Resolved', data: data.resolved, borderColor: '#15803d', backgroundColor: 'rgba(21,128,61,0.1)', tension: 0.25 },
            ],
        },
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });
}

async function loadByStatus() {
    const data = await fetchJson('/api/reports/by-status');
    const colors = { New: '#3730a3', Open: '#1e40af', Pending: '#92400e', Resolved: '#166534', Closed: '#374151' };
    drawChart('status-chart', {
        type: 'doughnut',
        data: {
            labels: data.rows.map((r) => r.Status),
            datasets: [{ data: data.rows.map((r) => r.Count), backgroundColor: data.rows.map((r) => colors[r.Status] || '#999') }],
        },
        options: { responsive: true },
    });
}

async function loadByPriority() {
    const data = await fetchJson('/api/reports/by-priority');
    const colors = { Low: '#6b7280', Medium: '#1e40af', High: '#92400e', Urgent: '#991b1b' };
    drawChart('priority-chart', {
        type: 'bar',
        data: {
            labels: data.rows.map((r) => r.Priority),
            datasets: [{ label: 'Tickets', data: data.rows.map((r) => r.Count), backgroundColor: data.rows.map((r) => colors[r.Priority] || '#999'), borderRadius: 6 }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });
}

async function loadByCategory() {
    const data = await fetchJson('/api/reports/by-category');
    drawChart('category-chart', {
        type: 'bar',
        data: {
            labels: data.rows.map((r) => r.CategoryName),
            datasets: [{ label: 'Tickets', data: data.rows.map((r) => r.Count), backgroundColor: '#2563eb', borderRadius: 6 }],
        },
        options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } },
    });
}

async function loadWorkload() {
    const data = await fetchJson('/api/reports/agent-workload');
    drawChart('workload-chart', {
        type: 'bar',
        data: {
            labels: data.rows.map((r) => r.AgentName),
            datasets: [
                { label: 'Open', data: data.rows.map((r) => r.OpenCount), backgroundColor: '#2563eb', borderRadius: 6 },
                { label: 'Closed', data: data.rows.map((r) => r.ClosedCount), backgroundColor: '#9ca3af', borderRadius: 6 },
            ],
        },
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });
}

Promise.all([loadSummary(), loadTrend(), loadByStatus(), loadByPriority(), loadByCategory(), loadWorkload()])
    .catch((err) => console.error('Failed to load reports:', err));
</script>
</body>
</html>
