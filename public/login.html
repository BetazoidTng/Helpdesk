<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Log in - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/login.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
</nav>

<main class="narrow">
    <h1>Log in</h1>
    <div class="panel">
        <p class="notice-banner" id="idle-notice" style="display:none;">You were logged out after a period of inactivity. Please log back in.</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <p class="error" id="form-error" style="display:none;"></p>
            <button class="btn" type="submit" style="margin-top:16px;width:100%;">Log in</button>
        </form>
        <p class="meta" style="margin-top:16px;" id="register-line">Need to raise a ticket? <a href="/register.html">Create an account</a>.</p>
    </div>
</main>

<script>
if (new URLSearchParams(window.location.search).get('reason') === 'idle') {
    document.getElementById('idle-notice').style.display = 'block';
}

// Fresh install with no Admin yet -- send straight to setup instead of
// showing a login form nobody can possibly log into.
fetch('/api/setup/status').then(r => r.json()).then((status) => {
    if (status.needsSetup) window.location.href = '/setup.html';
}).catch(() => {});

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.style.display = 'none';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        credentials: 'same-origin',
    });
    const data = await res.json();

    if (!res.ok) {
        errorEl.textContent = data.error || 'Login failed.';
        errorEl.style.display = 'block';
        return;
    }

    const staff = data.user.role === 'Admin' || data.user.role === 'Agent';
    window.location.href = staff ? '/queue.html' : '/portal.html';
});
</script>
</body>
</html>
