<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5f9">
<title>Ticket - Helpdesk</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/queue.html"><img src="/img/logo.png" alt="Bearing Services Africa"></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <div class="links" id="nav-links"></div>
</nav>

<main>
    <p class="meta"><a href="#" id="back-link">&larr; Back</a></p>
    <div id="ticket-root"><p class="meta">Loading...</p></div>
</main>

<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script>
const ticketId = new URLSearchParams(window.location.search).get('id');
let currentUser = null;
let currentTicket = null;
let isStaff = false;

document.getElementById('back-link').addEventListener('click', (e) => {
    e.preventDefault();
    window.history.length > 1 ? window.history.back() : (window.location.href = '/queue.html');
});

async function loadUser() {
    const data = await fetchJson('/api/auth/me');
    currentUser = data.user;
    isStaff = currentUser && (currentUser.role === 'Admin' || currentUser.role === 'Agent');
}

async function loadCategories() {
    try {
        const data = await fetchJson('/api/categories');
        return data.categories;
    } catch (err) {
        return [];
    }
}

async function loadAgents() {
    try {
        const data = await fetchJson('/api/tickets/meta/agents');
        return data.agents;
    } catch (err) {
        return [];
    }
}

function renderThread(comments) {
    // A delete button on an attachment is only shown here when it would
    // actually be allowed server-side too (see DELETE
    // /api/tickets/attachments/:id in server/routes/tickets.js): Staff can
    // remove anything, a Requester only something they uploaded themselves
    // (an email-sourced attachment has no AuthorId, so no one but Staff
    // sees a button on those).
    return comments.map((c) => {
        const canDelete = isStaff || (currentUser && c.AuthorId === currentUser.id);
        return `
        <div class="thread-item ${c.IsInternalNote ? 'internal-note' : ''}">
            <div class="thread-head">
                <strong>${escapeHtml(c.AuthorName || c.AuthorEmail || 'Unknown')}</strong>
                <span class="meta">${formatDateTime(c.CreatedAt)} ${c.Source === 'Email' ? '&middot; via email' : ''} ${c.IsInternalNote ? '&middot; internal note' : ''}</span>
            </div>
            <div class="thread-body">${escapeHtml(c.Body)}</div>
            ${c.attachments.length > 0 ? `<div class="attachments">${c.attachments.map((a) => `
                ${(a.MimeType || '').startsWith('image/') ? `
                <span class="attachment-image">
                    <a href="/api/tickets/attachments/${a.Id}/view" target="_blank"><img src="/api/tickets/attachments/${a.Id}/view" alt="${escapeHtml(a.OriginalName)}"></a>
                    <a href="/api/tickets/attachments/${a.Id}/download">${escapeHtml(a.OriginalName)} (download)</a>
                    ${canDelete ? `<a href="#" class="attachment-delete" data-delete-attachment="${a.Id}">Delete</a>` : ''}
                </span>
                ` : `
                <a href="/api/tickets/attachments/${a.Id}/view" target="_blank">${escapeHtml(a.OriginalName)}</a>
                <a href="/api/tickets/attachments/${a.Id}/download">(download)</a>
                ${canDelete ? `<a href="#" class="attachment-delete" data-delete-attachment="${a.Id}">Delete</a>` : ''}
                `}
            `).join('')}</div>` : ''}
        </div>
    `;
    }).join('');
}

async function deleteAttachment(attachmentId) {
    if (!window.confirm('Delete this attachment? This cannot be undone.')) return;
    try {
        await fetchJson(`/api/tickets/attachments/${attachmentId}`, { method: 'DELETE' });
        render();
    } catch (err) {
        window.alert(err.message);
    }
}

// One-click screenshot upload: skips typing a note and hitting Send
// entirely -- posts a minimal comment ("Screenshot attached.") carrying
// just the image. Tries the clipboard first (so "copy screenshot, click
// this button" works with no file dialog at all), and falls back to the
// file picker when the Clipboard API isn't available, isn't permitted, or
// the clipboard has no image on it right now.
async function uploadScreenshotNow(file) {
    const statusEl = document.getElementById('screenshot-upload-status');
    const errorEl = document.getElementById('reply-error');
    errorEl.style.display = 'none';
    statusEl.style.display = 'block';
    statusEl.textContent = 'Uploading screenshot...';
    const fd = new FormData();
    fd.append('body', 'Screenshot attached.');
    fd.append('attachments', file, file.name || `screenshot-${Date.now()}.png`);
    try {
        const res = await fetch(`/api/tickets/${ticketId}/comments`, { method: 'POST', body: fd, credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Failed to upload screenshot.');
        render();
    } catch (err) {
        statusEl.style.display = 'none';
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
    }
}

async function render() {
    const root = document.getElementById('ticket-root');
    let data;
    try {
        data = await fetchJson(`/api/tickets/${ticketId}`);
    } catch (err) {
        root.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        return;
    }
    currentTicket = data.ticket;
    const t = currentTicket;
    document.title = `${t.TicketNumber} - Helpdesk`;

    const [categories, agents] = isStaff ? await Promise.all([loadCategories(), loadAgents()]) : [[], []];

    root.innerHTML = `
        <div class="panel">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                <div>
                    <h1>${escapeHtml(t.TicketNumber)}: ${escapeHtml(t.Subject)}</h1>
                    <p class="meta">
                        ${statusBadge(t.Status)} ${priorityBadge(t.Priority)}
                        ${t.SLABreached ? '<span class="badge breached">SLA Breached</span>' : ''}
                        &middot; Requester: ${escapeHtml(t.RequesterName || t.RequesterEmail || '')}
                        &middot; Category: ${escapeHtml(t.CategoryName || 'Uncategorized')}
                        &middot; Assigned: ${escapeHtml(t.AssignedAgentName || 'Unassigned')}
                    </p>
                    <p class="meta">
                        Created ${formatDateTime(t.CreatedAt)}
                        &middot; SLA resolution due ${formatDateTime(t.SLAResolutionDueAt)}
                    </p>
                </div>
                ${isStaff ? `
                <div>
                    <button class="btn small secondary" id="start-remote-btn" type="button">Start remote session</button>
                    <p class="error" id="remote-start-error" style="display:none;margin-top:4px;"></p>
                    <p class="meta" id="remote-session-link-wrap" style="display:none;margin-top:4px;"></p>
                </div>
                ` : ''}
            </div>

            ${isStaff ? `
            <form id="update-form" style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px;">
                <div class="form-grid">
                    <div>
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            ${['New', 'Open', 'Pending', 'Resolved', 'Closed'].map((s) => `<option value="${s}" ${s === t.Status ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            ${['Low', 'Medium', 'High', 'Urgent'].map((p) => `<option value="${p}" ${p === t.Priority ? 'selected' : ''}>${p}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label for="categoryId">Category</label>
                        <select id="categoryId" name="categoryId">
                            <option value="">(none)</option>
                            ${categories.map((c) => `<option value="${c.Id}" ${c.Id === t.CategoryId ? 'selected' : ''}>${escapeHtml(c.Name)}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label for="assignedAgentId">Assigned to</label>
                        <select id="assignedAgentId" name="assignedAgentId">
                            <option value="">Unassigned</option>
                            ${agents.map((a) => `<option value="${a.Id}" ${a.Id === t.AssignedAgentId ? 'selected' : ''}>${escapeHtml(a.FullName)}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <p class="error" id="update-error" style="display:none;"></p>
                <button class="btn small" type="submit" style="margin-top:10px;">Save changes</button>
            </form>
            ` : ''}
        </div>

        <div class="panel">
            <h2>Conversation</h2>
            <div id="thread">${renderThread(data.comments)}</div>

            <form id="reply-form" style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px;">
                <label for="body">${isStaff ? 'Reply or add an internal note' : 'Add a reply'}</label>
                <textarea id="body" name="body" rows="4" required></textarea>
                <label for="attachments">Attachments (optional)</label>
                <input type="file" id="attachments" name="attachments" multiple>
                <div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;">
                    <button type="button" class="btn small secondary" id="screenshot-upload-btn">Upload screenshot</button>
                    <span class="paste-hint" style="margin:0;">or paste one (Ctrl+V / Cmd+V) into the reply box above</span>
                </div>
                <input type="file" id="screenshot-direct-input" accept="image/*" style="display:none;">
                <p class="meta" id="screenshot-upload-status" style="display:none;"></p>
                <div class="paste-preview" id="attachments-preview" style="display:none;"></div>
                ${isStaff ? `
                <label style="display:flex;align-items:center;gap:6px;margin-top:10px;">
                    <input type="checkbox" id="isInternalNote" name="isInternalNote" style="width:auto;">
                    <span class="meta" style="margin:0;">Internal note (hidden from the requester)</span>
                </label>
                ` : ''}
                <p class="error" id="reply-error" style="display:none;"></p>
                <button class="btn small" type="submit" style="margin-top:10px;">Send</button>
            </form>
        </div>
    `;

    if (isStaff) {
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('update-error');
            errorEl.style.display = 'none';
            const body = Object.fromEntries(new FormData(e.target).entries());
            try {
                await fetchJson(`/api/tickets/${ticketId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                render();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        document.getElementById('start-remote-btn').addEventListener('click', async () => {
            const errorEl = document.getElementById('remote-start-error');
            const linkWrap = document.getElementById('remote-session-link-wrap');
            errorEl.style.display = 'none';
            linkWrap.style.display = 'none';
            const btn = document.getElementById('start-remote-btn');
            btn.disabled = true;
            try {
                const data2 = await fetchJson('/api/remote-assist/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticketId: Number(ticketId) }),
                });
                const qs = new URLSearchParams({
                    sessionId: data2.id, code: data2.code,
                    ticketId: data2.ticketId, ticketNumber: data2.ticketNumber,
                });
                const url = `/remote-assist.html?${qs.toString()}`;
                // Browsers routinely block a window.open() that isn't
                // tied closely enough to the click for their liking, and
                // do so silently -- no error, no console warning, the tab
                // just never appears. Rather than try to detect that
                // (unreliable across browsers), always leave a real link
                // behind here too, so there's never a dead end.
                window.open(url, '_blank');
                linkWrap.innerHTML = `Session code <strong>${escapeHtml(data2.code)}</strong> -- if a new tab didn't open, <a href="${url}" target="_blank" rel="noopener">click here to open the viewer</a>.`;
                linkWrap.style.display = 'block';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });
    }

    const pasteAttachments = setupPasteAttachments({
        pasteTarget: document.getElementById('body'),
        fileInputId: 'attachments',
        previewId: 'attachments-preview',
        maxFiles: 5,
    });

    document.getElementById('screenshot-upload-btn').addEventListener('click', async () => {
        if (navigator.clipboard && navigator.clipboard.read) {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find((ty) => ty.startsWith('image/'));
                    if (!imageType) continue;
                    const blob = await item.getType(imageType);
                    const ext = (imageType.split('/')[1] || 'png').split(';')[0];
                    const file = new File([blob], `screenshot-${Date.now()}.${ext}`, { type: imageType });
                    await uploadScreenshotNow(file);
                    return;
                }
            } catch (err) {
                // Clipboard read denied, unsupported, or nothing on it right
                // now -- fall through to the file picker below.
            }
        }
        document.getElementById('screenshot-direct-input').click();
    });

    document.getElementById('screenshot-direct-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (file) await uploadScreenshotNow(file);
    });

    document.getElementById('reply-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('reply-error');
        errorEl.style.display = 'none';
        const form = new FormData(e.target);
        if (!isStaff) form.delete('isInternalNote');
        else form.set('isInternalNote', document.getElementById('isInternalNote').checked ? 'true' : 'false');
        pasteAttachments.appendTo(form);
        try {
            const res = await fetch(`/api/tickets/${ticketId}/comments`, { method: 'POST', body: form, credentials: 'same-origin' });
            const data2 = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data2.error || 'Failed to send.');
            render();
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
        }
    });
}

// Delegated once on the (static) root element, since its innerHTML --
// including the thread's delete links -- is replaced wholesale on every
// render() rather than patched in place.
document.getElementById('ticket-root').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-delete-attachment]');
    if (!btn) return;
    e.preventDefault();
    deleteAttachment(btn.dataset.deleteAttachment);
});

(async function init() {
    await loadUser();
    await render();
})();
</script>
</body>
</html>
